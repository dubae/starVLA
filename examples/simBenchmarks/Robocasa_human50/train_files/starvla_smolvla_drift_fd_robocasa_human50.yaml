run_id: starvla_smolvla_drift_fd_robocasa_human50
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_robocasa_human50
is_debug: false

# SmolVLA full fine-tuning with the Drifting-model objective (arXiv 2602.04770) instead of
# flow matching. Everything else is the `starvla_smolvla_full_robocasa_human50.yaml` recipe
# (chunk 50, batch 32 observations, AdamW 1e-4 (0.9, 0.95), 1k warmup, cosine to 2.5e-6).
# The expert is a one-step generator a = eps - v(eps, t=1); per observation it draws
# `drift_num_gen` chunks (VLM prefix computed once, K/V shared), which are attracted to the
# ground-truth chunk and repel each other (generated samples are the negatives). 1 NFE at eval.
# + forward-dynamics loss: f(a_gt, z_t) regresses sg(z_{t+50}), the vision latents (SigLIP +
# connector, trained, not frozen) of the camera frames at the end of the chunk. Target and prediction
# are LayerNorm-ed per token before the L2 (without it the loss ran away: 19 -> 6000 in 6k steps).
# Weight 100: at init the drift loss' gradient norm on the shared weights is ~100x the fd loss'.
framework:
  name: SmolVLA
  action_model:
    action_dim: 12        # eef_pos(3) + eef_rot(3) + gripper_close(1) + base_motion(4) + control_mode(1)
    action_horizon: 50    # must match PandaOmronRoboCasaHuman50Chunk50DataConfig.action_indices
  smolvla:
    vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
    pretrained_policy_path: lerobot/smolvla_base
    num_images: 3         # left agentview, right agentview, eye-in-hand (training registry order)
    num_steps: 1          # unused by the drift objective (always 1 NFE)
    freeze_vision_encoder: false
    train_expert_only: false
    objective: drift
    drift_num_gen: 16
    drift_R_list: [0.02, 0.05, 0.2]
    fd_loss_weight: 100.0  # loss = drift + w * L2(LN(sg(z_{t+50})), LN(f(a_gt, z_t)))
    fd_layernorm: true
    fd_hidden: 512
    fd_layers: 4
    fd_heads: 8
    torch_compile: true   # VLM prefill + expert compiled in training (needs CC, e.g. conda gcc)

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true   # SmolVLA conditions on proprio state (16-D -> sin/cos 32-D)
    data_root_dir: playground/Datasets/robocasa_human50
    data_mix: robocasa_human50_all_chunk50_future50
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 32
    num_workers: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av

trainer:
  max_train_steps: 50000
  num_warmup_steps: 1000
  save_interval: 10000
  eval_interval: 5000
  learning_rate:
    base: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.5e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
  # Under DeepSpeed the clipping value in starVLA/config/deepseeds/ds_config.yaml (1.0) applies.
  max_grad_norm: 1.0
  weight_decay: 1.0e-10
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
