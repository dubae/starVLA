run_id: starvla_smolvla_robocasa365_OpenDrawer
run_root_dir: results/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starVLA_robocasa365
is_debug: false

# SmolVLA baseline: SmolVLM2-500M (first 16 layers) + 0.75x-width flow-matching action
# expert, initialized from `lerobot/smolvla_base`. Model defaults follow LeRobot; see
# starVLA/model/framework/VLM4A/SmolVLA.py for every available key.
framework:
  name: SmolVLA
  action_model:
    action_dim: 12        # eef_pos(3) + eef_rot(3) + gripper_close(1) + base_motion(4) + control_mode(1)
    action_horizon: 16    # must match PandaOmronRoboCasa365DataConfig.action_indices
  smolvla:
    vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
    pretrained_policy_path: lerobot/smolvla_base   # "" = SmolVLM2 weights + random expert
    num_images: 3         # left agentview, right agentview, eye-in-hand (training registry order)
    num_steps: 10         # Euler denoising steps at inference
    freeze_vision_encoder: true
    train_expert_only: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true   # SmolVLA conditions on proprio state (16-D -> sin/cos 32-D)
    data_root_dir: playground/Datasets/robocasa365
    data_mix: robocasa365_open_drawer_target_human
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av

trainer:
  # Walk-through default; the launchers override max_train_steps.
  max_train_steps: 100
  num_warmup_steps: 1000
  save_interval: 100
  eval_interval: 1000
  # LeRobot SmolVLA preset: AdamW(lr=1e-4, betas=(0.9, 0.95), wd=1e-10), cosine decay to 2.5e-6.
  learning_rate:
    base: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 2.5e-06
  # Mirrors train_expert_only=true so the frozen VLM never enters the optimizer.
  freeze_modules: vlm_with_expert.vlm
  loss_scale:
    vla: 1.0
  # LeRobot clips at 10; under DeepSpeed the value in starVLA/config/deepseeds/ds_config.yaml applies.
  max_grad_norm: 1.0
  weight_decay: 1.0e-10
  logging_frequency: 5
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-10
